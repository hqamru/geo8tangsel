<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT PWA Ringan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Mencegah seleksi teks */
        body { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">
    
    <!-- Screen 1: Login / Mulai -->
    <div id="start-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center">
            <h1 class="text-2xl font-bold mb-4">Ujian Daring</h1>
            <input type="text" id="input-nama" placeholder="Nama Lengkap" class="w-full mb-3 p-2 border rounded">
            <input type="text" id="input-kelas" placeholder="Kelas" class="w-full mb-5 p-2 border rounded">
            <button id="btn-mulai" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">
                Mulai Ujian (Layar Penuh)
            </button>
            <p class="text-xs text-gray-500 mt-4">Pastikan koneksi stabil. Tab tidak boleh ditukar.</p>
        </div>
    </div>

    <!-- Screen 2: Area Ujian -->
    <div id="exam-screen" class="hidden flex-col min-h-screen">
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <h2 class="font-bold">Ujian Berlangsung</h2>
            <div id="student-info" class="text-sm"></div>
        </header>
        
        <main class="flex-grow p-4 md:p-8 max-w-3xl mx-auto w-full">
            <div id="loading" class="text-center py-10">Memuat soal...</div>
            <div id="question-container" class="space-y-6 hidden"></div>
            <button id="btn-submit" class="mt-8 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded w-full hidden">
                Kirim Jawaban Akhir
            </button>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
